<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2EFE6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CARRY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>CARRY · Coach de golf</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#F2EFE6; --glow1:rgba(200,245,58,.30); --glow2:rgba(61,107,255,.12);
  --surface:#FFFEFA; --surface2:#F7F4EC; --raise:#FFFFFF;
  --text:#0D1A13; --text2:#36423B; --mute:#68716B; --line:rgba(13,26,19,.09); --line2:rgba(13,26,19,.17);
  --chip:#FFFFFF; --press:rgba(13,26,19,.06); --tabbg:rgba(13,26,19,.93);
  --hero:#0D1A13; --herobd:transparent;
  --tee:#FF5A36; --app:#3D6BFF; --wedge:#0FB37F; --short:#F5A00B; --putt:#8B5CF6;
  --g-tee:linear-gradient(135deg,#FF7A45 0%,#EE3459 100%);
  --g-app:linear-gradient(135deg,#3D7BFF 0%,#5A43EE 100%);
  --g-wedge:linear-gradient(135deg,#10B381 0%,#0A7A84 100%);
  --g-short:linear-gradient(135deg,#FFCB45 0%,#FF8A1A 100%);
  --g-putt:linear-gradient(135deg,#8B5CF6 0%,#C13BE0 100%);
  --g-warm:linear-gradient(135deg,#2B3E33 0%,#0D1A13 100%);
  --lime:#C8F53A; --ok:#0FA874; --bad:#EF4438; --warn:#B8610A;
  --shadow:0 1px 0 rgba(13,26,19,.03),0 14px 34px -22px rgba(13,26,19,.40);
  --grain:.05;
  --r:22px;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --ui:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#070C09; --glow1:rgba(200,245,58,.11); --glow2:rgba(61,107,255,.13);
  --surface:#0F1813; --surface2:#131E18; --raise:#18251E;
  --text:#EDF2EA; --text2:#C7D0C9; --mute:#8B988F; --line:rgba(237,242,234,.075); --line2:rgba(237,242,234,.15);
  --chip:#15211A; --press:rgba(237,242,234,.07); --tabbg:rgba(21,33,26,.92);
  --hero:#0E1A14; --herobd:rgba(237,242,234,.08);
  --ok:#22C58C; --bad:#FF5A4E; --warn:#F0A040;
  --shadow:0 1px 0 rgba(255,255,255,.02),0 18px 40px -26px rgba(0,0,0,.9);
  --grain:.07;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-top:var(--sat);position:relative}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:radial-gradient(60% 40% at 0% 0%,var(--glow1),transparent 70%),radial-gradient(50% 35% at 100% 6%,var(--glow2),transparent 70%)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:var(--grain);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--app);outline-offset:2px}
input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wrap{max-width:620px;margin:0 auto;padding:14px 16px calc(112px + var(--sab))}
/* top */
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.035em}
.brand svg{width:32px;height:32px}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);background:var(--surface);border:1px solid var(--line);padding:5px 10px;border-radius:99px}
.sync i{width:7px;height:7px;border-radius:50%;background:#A7ADA6;display:block}
.sync.ok i{background:var(--ok)} .sync.loading i{background:var(--short);animation:pulse 1s infinite} .sync.error i,.sync.slow i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin:0 0 14px;box-shadow:var(--shadow)}
.card h3{font-family:var(--display);font-size:20px;margin:0 0 4px;letter-spacing:-.025em;font-weight:750;line-height:1.15}
.eyebrow{font-size:11px;font-weight:650;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.muted{color:var(--mute)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center} .between{justify-content:space-between} .wrapf{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sec-title{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.045em;margin:6px 2px 10px;line-height:1}
.sec-sub{margin:0 2px 16px;color:var(--mute)}
.hr{height:1px;background:var(--line);margin:14px 0}
/* hero */
.hero{position:relative;overflow:hidden;background:var(--hero);color:#F4F2EA;border-radius:30px;padding:20px 20px 18px;margin-bottom:14px;isolation:isolate;border:1px solid var(--herobd);box-shadow:0 24px 50px -30px rgba(13,26,19,.6)}
.hero .eyebrow{color:rgba(244,242,234,.6)}
.hero h1{font-family:var(--display);font-weight:800;font-size:40px;line-height:.95;letter-spacing:-.05em;margin:14px 0 8px;max-width:11ch;text-shadow:0 2px 18px rgba(13,26,19,.8)}
.hero p{margin:0;color:rgba(244,242,234,.8);max-width:30ch;text-shadow:0 1px 14px #0D1A13,0 0 4px #0D1A13}
.hero .traces{position:absolute;inset:0;z-index:-1;width:100%;height:100%;opacity:.95}
.hero .traces path.tr{fill:none;stroke-width:2.4;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.2,.7,.2,1) forwards;filter:drop-shadow(0 0 5px currentColor)}
.hero .traces circle{opacity:0;animation:pop .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}} @keyframes pop{to{opacity:1}}
.hero .ground{position:absolute;left:0;right:0;bottom:0;height:55%;z-index:-2;background:linear-gradient(180deg,rgba(16,179,129,0) 0%,rgba(16,179,129,.13) 100%)}
.lvchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;text-decoration:none;color:#0D1A13;background:var(--lime);padding:5px 10px;border-radius:99px;white-space:nowrap}
.hero-stats{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px;margin-top:18px}
.hstat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:11px 12px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);min-width:0}
.hstat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1}
.hstat span{font-size:11px;color:rgba(244,242,234,.62);display:block;line-height:1.25}
.hstat.rank{display:flex;align-items:center;gap:9px;padding:9px 10px}
.hstat.rank span{font-size:11px}
.ring{width:44px;height:44px;flex:0 0 auto}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:99px;font-weight:650;background:var(--text);color:var(--bg);text-decoration:none;transition:transform .12s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.lime{background:var(--lime);color:#0D1A13}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--text)}
.btn.onhero{background:transparent;border:1.5px solid rgba(255,255,255,.22);color:#fff}
.btn.block{width:100%} .btn.big{height:58px;font-size:17px} .btn.sm{height:36px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{color:var(--app);font-weight:650;text-decoration:none}
[data-theme="dark"] .link{color:#8FA9FF}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -18px;padding:2px 18px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line2);background:var(--chip);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;transition:transform .1s,background .12s,border-color .12s;color:var(--text)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--c,var(--text));border-color:transparent;color:var(--onc,var(--bg))}
.chip small{font-family:var(--mono);font-weight:500;opacity:.65;font-size:12px}
.chip svg{flex:0 0 auto}
.chip.ic{flex-direction:column;justify-content:center;gap:1px;min-height:58px;padding:6px 4px;border-radius:16px;font-size:11.5px;flex:1;min-width:0}
.chiprow{display:flex;gap:6px}
.seg{display:flex;background:var(--press);border-radius:99px;padding:4px;gap:4px}
.seg button{flex:1;min-height:38px;border-radius:99px;font-weight:600;font-size:14px;color:var(--mute);padding:0 6px}
.seg button.on{background:var(--raise);color:var(--text);box-shadow:0 2px 8px -2px rgba(0,0,0,.18)}
/* tags */
.tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) 78%,var(--text));white-space:nowrap}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c)}
/* strip */
.strip{display:flex;gap:3px;height:10px;margin:12px 0 4px}
.strip i{display:block;border-radius:4px;min-width:4px}
/* plan timeline */
.blk{position:relative;display:grid;grid-template-columns:50px 1fr;gap:12px;padding:0 0 12px}
.blk .rail{display:flex;flex-direction:column;align-items:center}
.blk .rail .dot{width:46px;height:46px;border-radius:16px;background:var(--g);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 10px 20px -10px var(--c)}
.blk .rail .dot b{font-family:var(--mono);font-size:11px;font-weight:600;line-height:1;margin-top:1px}
.blk .rail .ln{flex:1;width:3px;background:linear-gradient(var(--c),transparent);margin-top:6px;border-radius:3px;opacity:.45}
.blk .body{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow)}
.blk .body h4{margin:6px 0 3px;font-family:var(--display);font-size:18px;letter-spacing:-.025em;line-height:1.15}
.blk .meta{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:8px}
.blk .meta b{color:var(--text);font-weight:650}
/* level card */
.lvcard{position:relative;overflow:hidden}
.lvcard .big{position:absolute;right:14px;top:8px;font-family:var(--display);font-weight:800;font-size:78px;letter-spacing:-.06em;color:var(--text);opacity:.06;line-height:1;pointer-events:none}
.goals{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.goals li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:14px}
.goals li b{width:26px;height:26px;border-radius:9px;background:var(--lime);color:#0D1A13;font-family:var(--mono);font-size:12px;display:flex;align-items:center;justify-content:center}
.notyet{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.notyet span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--mute);background:var(--press);padding:5px 9px;border-radius:99px}
/* live */
.live-head{display:flex;gap:4px;margin:2px 0 14px}
.live-head i{flex:1;height:6px;border-radius:6px;background:var(--press)}
.live-head i.done{background:var(--c);opacity:.55} .live-head i.cur{background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.drill-card{border-radius:28px;padding:18px;color:var(--dc,#fff);background:var(--g);position:relative;overflow:hidden;margin-bottom:12px;isolation:isolate}
.drill-card .bgico{position:absolute;right:-24px;bottom:-30px;opacity:.16;z-index:-1}
.drill-card h2{font-family:var(--display);font-size:30px;line-height:.98;letter-spacing:-.045em;margin:12px 0 8px}
.drill-card p{margin:0;opacity:.92}
.drill-card .ph{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;background:rgba(0,0,0,.16);padding:5px 10px;border-radius:99px;display:inline-flex;gap:6px;align-items:center}
.drill-card .timer{font-family:var(--mono);font-size:14px;background:rgba(0,0,0,.18);padding:6px 12px;border-radius:99px;color:inherit}
.keytip{margin-top:12px;background:rgba(0,0,0,.16);border-radius:16px;padding:11px 12px;font-size:14px;display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:start;line-height:1.35}
.drill-card details{margin-top:10px}
.drill-card summary{font-weight:650;font-size:14px;opacity:.95}
.drill-card ol,.drill-card ul{margin:8px 0 0;padding-left:20px} .drill-card li{margin:4px 0}
details summary{cursor:pointer;list-style:none} details summary::-webkit-details-marker{display:none}
.target{background:var(--hero);color:#F4F2EA;border-radius:24px;padding:16px 18px 14px;margin-bottom:12px;border:1px solid var(--herobd)}
.target .lbl{font-size:11.5px;color:rgba(244,242,234,.6);letter-spacing:.08em;text-transform:uppercase;font-weight:650}
.target .big{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.045em;line-height:1.05;margin-top:2px}
.target .sub{font-family:var(--mono);font-size:12.5px;color:var(--lime);margin-top:2px}
.streak{font-family:var(--mono);font-size:12px;text-align:right;color:rgba(244,242,234,.7);flex:0 0 auto}
.streak b{display:block;font-size:28px;color:#fff;line-height:1}
.winbar{position:relative;height:34px;margin-top:12px}
.winbar .trk{position:absolute;left:0;right:0;top:14px;height:6px;border-radius:6px;background:rgba(255,255,255,.1)}
.winbar .band{position:absolute;top:10px;height:14px;border-radius:7px;background:rgba(200,245,58,.28);border:1px solid rgba(200,245,58,.6)}
.winbar .tgt{position:absolute;top:6px;width:2px;height:22px;background:#fff;opacity:.7;transform:translateX(-1px)}
.winbar .cur{position:absolute;top:8px;width:18px;height:18px;border-radius:50%;transform:translateX(-9px);border:3px solid #0D1A13;transition:left .15s}
.winbar .lab{position:absolute;top:-2px;font-family:var(--mono);font-size:10px;color:rgba(244,242,234,.5);transform:translateX(-50%)}
.field{margin:0 0 15px}
.field>label,.field>.lab{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 2px 7px}
.counts{font-size:10px;letter-spacing:.06em;color:#0D1A13;background:var(--lime);padding:2px 7px;border-radius:99px}
.stepper{display:grid;grid-template-columns:48px 48px 1fr 48px 48px;gap:6px}
.stepper button{height:64px;border-radius:16px;background:var(--press);font-family:var(--mono);font-weight:600;font-size:15px;color:var(--text)}
.stepper button:active{background:var(--line2)}
.stepper .val{height:64px;border-radius:16px;background:var(--raise);border:1.5px solid var(--line2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:32px;font-weight:600;letter-spacing:-.04em;line-height:1}
.stepper .val small{font-size:11px;color:var(--mute);letter-spacing:0;margin-top:3px;font-weight:500}
.stepper .val.empty{color:var(--mute)}
.stepper .val.in{border-color:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 20%,transparent)}
.stepper .val.out{border-color:var(--bad)}
.result{border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;font-weight:650;margin-bottom:10px;background:var(--press)}
.result.ok{background:color-mix(in srgb,var(--ok) 15%,var(--surface));color:color-mix(in srgb,var(--ok) 72%,var(--text))}
.result.ko{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:color-mix(in srgb,var(--bad) 70%,var(--text))}
.result .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;flex:0 0 auto;background:var(--text)}
.result.ok .ic{background:var(--ok)} .result.ko .ic{background:var(--bad)}
.coach{display:grid;grid-template-columns:38px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:13px 14px;margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.coach::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--lime)}
.coach .cic{width:38px;height:38px;border-radius:12px;background:var(--hero);color:var(--lime);display:flex;align-items:center;justify-content:center}
.coach b{display:block;font-size:14px;margin-bottom:2px}
.coach p{margin:0;font-size:13.5px;color:var(--text2);line-height:1.4}
/* fairway zones */
.zones-lbl{display:grid;grid-template-columns:.7fr 1fr 1.7fr 1fr .7fr;gap:4px;margin-bottom:4px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.zones-lbl span{text-align:center;border-top:2px solid var(--ok);padding-top:3px;color:var(--ok)}
.zones{display:grid;grid-template-columns:.7fr 1fr 1.7fr 1fr .7fr;gap:4px;padding:4px;border-radius:18px;background:var(--press)}
.zones button{height:66px;border-radius:13px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;transition:transform .1s}
.zones button:active{transform:scale(.96)}
.zones .z-ob{background:repeating-linear-gradient(135deg,rgba(239,68,56,.22) 0 7px,rgba(239,68,56,.10) 7px 14px);color:var(--bad)}
.zones .z-r{background:#3E7853;color:#E9F5E4}
.zones .z-c{background:repeating-linear-gradient(90deg,#86D873 0 14px,#78CC66 14px 28px);color:#0D1A13}
.zones button.on{outline:3px solid var(--text);outline-offset:-3px;transform:scale(1.02)}
.zones button.on::after{content:"✓";position:absolute;top:4px;right:6px;font-size:12px}
/* count */
.counter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.counter button{height:116px;border-radius:26px;font-family:var(--display);font-weight:800;font-size:26px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .1s}
.counter button:active{transform:scale(.97)}
.counter .yes{background:linear-gradient(135deg,#19C48D,#0A9467)} .counter .no{background:linear-gradient(135deg,#FF6A55,#E0322A)}
.counter button span{font-family:var(--ui);font-size:13px;font-weight:600;opacity:.9}
.tally{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 14px}
.tally i{width:16px;height:16px;border-radius:5px;background:var(--press);border:1px solid var(--line)}
.tally i.y{background:var(--ok);border-color:transparent} .tally i.n{background:var(--bad);border-color:transparent}
.shotlog{display:flex;flex-direction:column;gap:6px}
.shotrow{display:grid;grid-template-columns:12px 58px 1fr auto;gap:9px;align-items:center;font-size:13px;padding:9px 11px;border-radius:13px;background:var(--surface2)}
.okd{width:10px;height:10px;border-radius:50%;background:var(--mute);opacity:.5}
.okd.y{background:var(--ok);opacity:1} .okd.n{background:var(--bad);opacity:1}
table.mx{width:100%;border-collapse:collapse;font-size:13px}
table.mx th,table.mx td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line)}
table.mx th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);font-weight:650}
table.mx td:first-child,table.mx th:first-child{text-align:left;font-weight:650}
/* tabs */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sab));width:min(560px,calc(100% - 20px));display:grid;grid-template-columns:repeat(6,1fr);background:var(--tabbg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:26px;padding:7px;z-index:40;box-shadow:0 18px 40px -12px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.06)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;color:rgba(244,242,234,.55);text-decoration:none;font-size:10.5px;font-weight:650;padding:7px 0 6px;border-radius:19px;position:relative;transition:background .15s,color .15s}
.tabs a svg{width:22px;height:22px}
.tabs a.on{color:#0D1A13;background:var(--lime)}
.tabs a .live-dot{position:absolute;top:6px;right:calc(50% - 18px);width:8px;height:8px;border-radius:50%;background:var(--tee);box-shadow:0 0 0 2px #0D1A13;animation:pulse 1.2s infinite}
/* datos */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.04em;line-height:1.1}
.kpi span{font-size:12px;color:var(--mute)}
.gap-row{display:grid;grid-template-columns:96px 1fr 50px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.gap-row:last-child{border-bottom:0}
.gap-row .nm{font-weight:650;font-size:13px}
.gap-track{position:relative;height:22px;border-radius:8px;background:var(--press)}
.gap-track .rng{position:absolute;top:4px;bottom:4px;border-radius:6px;background:color-mix(in srgb,var(--c) 38%,transparent)}
.gap-track .med{position:absolute;top:0;bottom:0;width:4px;border-radius:3px;background:var(--c);transform:translateX(-2px)}
.gap-track .stk{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.35}
.gap-note{font-size:11px;font-family:var(--mono);text-align:right}
.warn{color:var(--warn)}
.bars{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:10px 0 8px;gap:2px}
.bars i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}
.disp{width:100%;height:auto;display:block;border-radius:18px}
.heat{display:grid;grid-template-columns:44px repeat(5,1fr);gap:4px;align-items:center;margin-top:10px}
.heat .h{font-size:10.5px;color:var(--mute);text-align:center;font-weight:650}
.heat .c{height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:600}
/* bag */
.club{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.club:last-child{border-bottom:0}
.club .ico{width:44px;height:44px;border-radius:14px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:13px}
.club.off .ico{background:var(--press);color:var(--mute)}
.club.off .nmw{opacity:.5}
.mini-step{display:flex;align-items:center;gap:4px}
.mini-step button{width:34px;height:34px;border-radius:10px;background:var(--press);font-weight:700}
.mini-step span{min-width:58px;text-align:center;font-family:var(--mono);font-weight:600;font-size:16px}
.est{font-size:9.5px;font-weight:750;letter-spacing:.06em;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);padding:2px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.sugg{font-size:12px;color:var(--app);margin-top:3px;font-weight:600}
input[type=text],input[type=number],textarea,select{width:100%;border:1.5px solid var(--line2);background:var(--raise);border-radius:14px;padding:11px 13px;font-size:16px;color:var(--text)}
textarea{min-height:84px;resize:vertical}
.toggle{position:relative;width:52px;height:32px;border-radius:99px;background:var(--line2);flex:0 0 auto;transition:background .2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.toggle.on{background:var(--ok)} .toggle.on::after{transform:translateX(20px)}
.hcpbox{display:grid;grid-template-columns:52px 1fr 52px;gap:8px;align-items:center}
.hcpbox button{height:56px;border-radius:16px;background:var(--press);font-size:22px;font-weight:700}
.hcpbox input{height:56px;text-align:center;font-family:var(--mono);font-size:28px;font-weight:600}
/* lists */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.list-item:last-child{border-bottom:0}
.sw{width:42px;height:42px;border-radius:13px;background:var(--g);flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--mono);font-weight:600;font-size:13px}
.list-item .t{font-weight:650} .list-item .s{font-size:12px;color:var(--mute)}
.chev{margin-left:auto;color:var(--mute)}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .12s}
.dcard:active{transform:scale(.98)}
.dcard .top{height:66px;background:var(--g);color:var(--dc,#fff);display:flex;justify-content:space-between;align-items:flex-start;padding:10px 11px;position:relative;overflow:hidden}
.dcard .top .bg{position:absolute;right:-10px;bottom:-16px;opacity:.28}
.dcard .top .mins{font-family:var(--mono);font-size:11px;font-weight:600;background:rgba(0,0,0,.18);padding:3px 8px;border-radius:99px}
.dcard .bd{padding:10px 12px 12px}
.dcard .bd b{display:block;font-family:var(--display);font-size:15.5px;letter-spacing:-.02em;line-height:1.15}
.dcard .bd span{font-size:11.5px;color:var(--mute);display:block;margin-top:4px}
.dcard.locked .top{background:var(--press);color:var(--mute)}
.dcard.locked .bd b{color:var(--mute)}
.dots{letter-spacing:1px;font-size:10px}
.wild{background:var(--hero);color:#fff;border-radius:22px;padding:16px 18px;margin-bottom:14px;border:1px solid var(--herobd);position:relative;overflow:hidden}
.wild::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 14px,transparent 14px 28px);pointer-events:none}
.wild .eyebrow{color:var(--lime)}
.wild p{margin:6px 0 0;font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.22;position:relative}
.banner{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);border-radius:18px;padding:12px 14px;margin-bottom:14px;font-size:13.5px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,10,7,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:min(620px,100%);max-height:88vh;overflow:auto;border-radius:28px 28px 0 0;padding:10px 18px calc(22px + var(--sab));animation:up .22s cubic-bezier(.2,.8,.2,1);border:1px solid var(--line)}
.sheet .grab{width:44px;height:5px;border-radius:5px;background:var(--line2);margin:4px auto 14px}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.6}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.pad button{height:62px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-family:var(--mono);font-size:24px;font-weight:600}
.pad button.ok{background:var(--lime);border-color:var(--lime);font-family:var(--ui);font-size:17px;color:#0D1A13}
.padval{font-family:var(--mono);font-size:54px;font-weight:600;text-align:center;letter-spacing:-.04em;padding:6px 0}
.toast{position:fixed;left:50%;top:calc(14px + var(--sat));transform:translateX(-50%);background:#0D1A13;color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:80;box-shadow:0 12px 30px -10px rgba(0,0,0,.45);animation:tdown .25s ease;max-width:calc(100% - 30px);border:1px solid rgba(255,255,255,.08)}
@keyframes tdown{from{transform:translate(-50%,-14px);opacity:0}}
.empty{border:1.5px dashed var(--line2);border-radius:18px;padding:22px;text-align:center;color:var(--mute)}
.steps-list{margin:8px 0 0;padding-left:20px} .steps-list li{margin:4px 0}
.tips{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.tips li{display:grid;grid-template-columns:20px 1fr;gap:8px;font-size:14px;line-height:1.38}
.why{font-size:13px;background:var(--press);border-radius:12px;padding:10px 12px;margin-top:12px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90}
.summary-big{font-family:var(--display);font-size:60px;font-weight:800;letter-spacing:-.05em;line-height:1}
.stars{display:flex;gap:6px}
.stars button{width:46px;height:46px;border-radius:13px;background:var(--press);font-size:20px}
.stars button.on{background:var(--lime);color:#0D1A13}
.insight{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
.insight td,.insight th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right}
.insight th{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);font-weight:650}
.insight td:first-child,.insight th:first-child{text-align:left}
.sc th,.sc td{padding:6px 3px;font-size:12px}
.sc sup{font-size:9px;opacity:.7;margin-left:1px}
::view-transition-old(root),::view-transition-new(root){animation-duration:.2s}
@media (min-width:760px){ .wrap{padding-top:28px} .hero h1{font-size:50px} .lib{grid-template-columns:1fr 1fr 1fr} }
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .hero .traces path.tr{stroke-dashoffset:0} .hero .traces circle{opacity:1}
}

// ---------- utilidades ----------
const $ = (s, el = document) => el.querySelector(s);

const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

const quant = (a, q) => { if (!a.length) return null; const s = a.slice().sort((x, y) => x - y); const p = (s.length - 1) * q; const lo = Math.floor(p), hi = Math.ceil(p); return s[lo] + (s[hi] - s[lo]) * (p - lo); };
const mean = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
const sd = a => { if (a.length < 2) return 0; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const fmtDate = ts => new Date(ts).toLocaleDateString("es-ES", { weekday: "short", day: "numeric", month: "short" });

const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

const DICO = { ladder: "ladder", call: "eye", clubs: "ladder", rot: "shuffle", norep: "shuffle", range9: "map", start: "arrow", curve: "curve", shapes: "curve", traj: "arc", ballpos: "target", heeltoe: "target", feet: "target", half: "target", towel: "target", speed: "gauge", double: "bolt", streak: "bolt", tt12: "chart", tt30: "chart", achal: "chart", wladder: "ladder", peyes: "eye" };

// palos de approach según nivel
function apSet(L) {
  const on = bagOn().filter(c => c.id !== "D");
  if (L <= 1) { const lim = (club("7i") && club("7i").carry) || 130; return on.filter(c => c.type === "wedge" || c.type === "hybrid" || (c.type === "iron" && c.carry <= lim + 1)); }
  if (L === 2) return on.filter(c => c.type !== "wood");
  return on;
}
const closestIn = (set, t) => { let b = null; for (const c of set) if (!b || Math.abs(c.carry - t) < Math.abs(b.carry - t)) b = c; return b ? b.id : null; };
function irRange(L) { const s = apSet(L).filter(c => c.type !== "wedge"); if (!s.length) return [90, 140]; return [Math.min(...s.map(c => c.carry)), Math.max(...s.map(c => c.carry))]; }
function randTargets(min, max, n, step = 5) {
  const out = []; let prev = null; min = r5(min); max = r5(max); if (max <= min) max = min + 20;
  const k = Math.floor((max - min) / step) + 1;
  for (let i = 0; i < n; i++) { let t, g = 0; do { t = min + step * Math.floor(Math.random() * k); g++; } while (prev != null && Math.abs(t - prev) < 10 && g < 25); out.push(t); prev = t; }
  return out;
}

// trazados estilo Toptracer
function tracesSVG(shots) {
  const W = 360, H0 = 330, cx = W * .76, y0 = H0 - 6;
  let items;
  if (shots && shots.length >= 4) {
    const mx = Math.max(...shots.map(s => s.carry || 0), 150);
    items = shots.slice(-12).map(s => ({ d: (s.carry || 100) / mx, lat: s.lat != null ? s.lat / 3 : ({ Izq: -12, Der: 12 }[s.start] || 0), crv: ({ L2: -22, L1: -10, R1: 10, R2: 22 }[s.curve] || 0), col: s.ok === true ? "#C8F53A" : s.ok === false ? "#FF5A36" : "#7CF5C3" }));
  } else {
    const cols = ["#FF6A3D", "#3D7BFF", "#10B381", "#FFB020", "#8B5CF6", "#C8F53A", "#7CF5C3"];
    items = Array.from({ length: 7 }, (_, i) => ({ d: .45 + Math.random() * .55, lat: (Math.random() - .5) * 36, crv: (Math.random() - .5) * 28, col: cols[i % cols.length] }));
  }
  const paths = items.map((it, i) => {
    const ey = y0 - (100 + it.d * 150); const ex = clamp(cx + (it.lat + it.crv) * 3.6 * (1 - it.d * .3), 10, W - 10);
    const c1x = cx + it.lat * 3.6 * .45, c1y = ey - 40 - it.d * 20, c2x = ex - it.crv * 2.2, c2y = ey - 34;
    const dl = (i * .13).toFixed(2);
    return `<path class="tr" d="M${cx},${y0} C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}" pathLength="1" stroke="${it.col}" style="color:${it.col};animation-delay:${dl}s"/><circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.2" fill="#fff" style="animation-delay:${(+dl + 1.4).toFixed(2)}s"/>`;
  }).join("");
  const grid = [70, 140, 210].map(k => { const y = y0 - k, half = 200 - k * .55; return `<line x1="${cx - half}" x2="${cx + half}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.07)"/><text x="${cx + half - 4}" y="${y - 4}" fill="rgba(255,255,255,.22)" font-size="9" text-anchor="end" font-family="Geist Mono">${k}</text>`; }).join("");
  return `<svg class="traces" viewBox="0 0 ${W} ${H0}" preserveAspectRatio="xMaxYMax slice" aria-hidden="true">${grid}<path d="M${cx},${y0} L${cx - 190},${y0 - 300} M${cx},${y0} L${cx + 190},${y0 - 300}" stroke="rgba(255,255,255,.05)"/>${paths}</svg>`;
}
const ring = p => `<svg class="ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="3.5"/><circle cx="18" cy="18" r="15.5" fill="none" stroke="#C8F53A" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="${(p * 97.4).toFixed(1)} 97.4" transform="rotate(-90 18 18)"/></svg>`;
const strip = blocks => `<div class="strip" aria-hidden="true">${blocks.map(b => { const a = D(b.drill).area; return `<i style="flex:${b.min};background:${AREAS[a].g}" title="${esc(bName(b))}"></i>`; }).join("")}</div>`;

  const tot = sess.reduce((a, s) => { s.blocks.forEach(b => { const t = blockStats(b); a.ok += t.ok; a.n += t.n; }); return a; }, { ok: 0, n: 0 });
  const clubsUsed = bagOn().filter(c => withCarry.some(x => x.club === c.id));
  const sel = S.ui.dataClub && clubsUsed.some(c => c.id === S.ui.dataClub) ? S.ui.dataClub : (clubsUsed.find(c => c.id === "7i") || clubsUsed[0] || {}).id;
  return `<h2 class="sec-title">Datos</h2>
  <div class="seg" style="margin-bottom:14px"><button class="${S.ui.dataRange === "all" ? "on" : ""}" data-a="drange" data-v="all">Todo</button><button class="${S.ui.dataRange === "5" ? "on" : ""}" data-a="drange" data-v="5">Últimas 5 sesiones</button></div>
  <div class="kpis"><div class="kpi"><b>${sess.length}</b><span>sesiones</span></div><div class="kpi"><b>${shots.length}</b><span>bolas registradas</span></div><div class="kpi"><b>${tot.n ? pct(tot.ok, tot.n) + "%" : "—"}</b><span>acierto en ejercicios</span></div><div class="kpi"><b>${withC.length ? pct(pure, withC.length) + "%" : "—"}</b><span>contacto puro</span></div></div>
  ${trendCard(all)}${gappingCard(withCarry)}${sel ? dispersionCard(withCarry, sel, clubsUsed) : ""}${patternCard(shots)}${contactCard(withC)}${wedgeMatrix(shots)}${scoreHistory(all)}

}
function trendCard(all) {
  const pts = all.slice(0, 12).reverse().map(s => { const t = s.blocks.reduce((a, b) => { const x = blockStats(b); a.ok += x.ok; a.n += x.n; return a; }, { ok: 0, n: 0 }); return t.n ? t.ok / t.n : null; }).filter(v => v != null);
  if (pts.length < 2) return "";
  const W = 320, H0 = 110, n = pts.length; const xy = pts.map((v, i) => [12 + i * (W - 24) / (n - 1), H0 - 12 - v * (H0 - 24)]);
  return `<div class="card"><div class="row between"><div class="eyebrow">Evolución del acierto</div><span class="num small">${Math.round(pts[n - 1] * 100)}%</span></div>
  <svg viewBox="0 0 ${W} ${H0}" style="width:100%;height:auto;margin-top:8px;color:var(--text)" role="img" aria-label="Acierto por sesión">
  ${[0, .5, 1].map(k => `<line x1="12" x2="${W - 12}" y1="${H0 - 12 - k * (H0 - 24)}" y2="${H0 - 12 - k * (H0 - 24)}" stroke="currentColor" opacity=".1"/><text x="${W - 10}" y="${H0 - 15 - k * (H0 - 24)}" font-size="9" text-anchor="end" fill="currentColor" opacity=".5" font-family="Geist Mono">${k * 100}%</text>`).join("")}
  <path d="M${xy.map(p => p.join(",")).join(" L")}" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${xy.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === n - 1 ? 5 : 3.5}" fill="${i === n - 1 ? "#C8F53A" : "currentColor"}" stroke="currentColor" stroke-width="1.5"/>`).join("")}</svg></div>`;
}
function gappingCard(shots) {
  const rows = bagOn().map(c => { const v = shots.filter(x => x.club === c.id).map(x => x.carry); return { c, n: v.length, med: median(v), lo: quant(v, .1), hi: quant(v, .9) }; }).filter(r => r.n);
  if (!rows.length) return "";
  const mx = Math.max(...rows.map(r => Math.max(r.hi, r.c.carry))) * 1.05;
  return `<div class="card"><div class="eyebrow">Distancias reales (carry)</div><p class="small muted" style="margin:4px 0 10px">Barra: el 80 % central de tus golpes. Línea gruesa: mediana. Línea fina: tu referencia en Bolsa. A la derecha, el hueco con el palo siguiente.</p>
  ${rows.map((r, i) => { const nx = rows[i + 1]; const gap = nx && r.med != null && nx.med != null ? Math.round(r.med - nx.med) : null; const bad = gap != null && (gap < 6 || gap > 20);
    return `<div class="gap-row" style="${aStyle(typeArea(r.c.type))}"><div><div class="nm">${esc(r.c.name)}</div><div class="muted num" style="font-size:11px;white-space:nowrap">${Math.round(r.med)} m · ${r.n} bolas</div></div>
    <div class="gap-track"><div class="rng" style="left:${r.lo / mx * 100}%;width:${Math.max(1, (r.hi - r.lo) / mx * 100)}%"></div><div class="stk" style="left:${r.c.carry / mx * 100}%"></div><div class="med" style="left:${r.med / mx * 100}%"></div></div>
    <div class="gap-note ${bad ? "warn" : "muted"}">${gap != null ? (bad ? "⚠ " : "") + gap + " m" : ""}</div></div>`; }).join("")}</div>`;
}
function dispersionCard(shots, sel, clubsUsed) {
  const v = shots.filter(x => x.club === sel); const c = club(sel); const lat = v.filter(x => x.lat != null);
  const W = 340, H0 = 400; const maxC = Math.max(c.carry * 1.25, ...v.map(x => x.carry)); const LAT = 45;
  const X = l => W / 2 + l / LAT * (W / 2 - 20), Y = d => H0 - 24 - d / maxC * (H0 - 48);
  const stripes = []; for (let d = 0; d <= maxC; d += 25) stripes.push(`<line x1="20" x2="${W - 20}" y1="${Y(d)}" y2="${Y(d)}" stroke="rgba(255,255,255,${d % 50 ? .05 : .12})"/>${d % 50 ? "" : `<text x="24" y="${Y(d) - 4}" fill="rgba(255,255,255,.45)" font-size="10" font-family="Geist Mono">${d}</text>`}`);
  let ell = ""; if (lat.length >= 4) { const mx = mean(lat.map(x => x.lat)), my = mean(lat.map(x => x.carry)), sx = sd(lat.map(x => x.lat)), sy = sd(lat.map(x => x.carry)); ell = `<ellipse cx="${X(mx)}" cy="${Y(my)}" rx="${Math.max(4, 2 * sx / LAT * (W / 2 - 20))}" ry="${Math.max(4, 2 * sy / maxC * (H0 - 48))}" fill="rgba(200,245,58,.10)" stroke="#C8F53A" stroke-dasharray="5 5" stroke-width="1.5"/>`; }
  const dots = lat.map(x => `<circle cx="${X(clamp(x.lat, -LAT, LAT))}" cy="${Y(x.carry)}" r="5" fill="${CONTACT_COL[x.contact] || "#fff"}" stroke="#0D1A13" stroke-width="1.2"/>`).join("");
  const ticks = v.filter(x => x.lat == null).map(x => `<line x1="${W - 16}" x2="${W - 6}" y1="${Y(x.carry)}" y2="${Y(x.carry)}" stroke="${CONTACT_COL[x.contact] || "#fff"}" stroke-width="2"/>`).join("");
  const cv = v.map(x => x.carry); const carryOnly = v.length - lat.length;
  return `<div class="card"><div class="row between"><div class="eyebrow">Dispersión</div><span class="small muted">${v.length} bolas</span></div>
  <div class="chips scroll" style="margin:10px -18px 12px">${clubsUsed.map(k => `<button class="chip ${k.id === sel ? "on" : ""}" data-a="dclub" data-v="${k.id}">${esc(k.name)}</button>`).join("")}</div>
  <svg class="disp" viewBox="0 0 ${W} ${H0}" role="img" aria-label="Mapa de dispersión de ${esc(c.name)}"><rect width="${W}" height="${H0}" rx="18" fill="#10261B"/>
    <path d="M${W / 2},${H0 - 24} L${X(-LAT)},${Y(maxC)} M${W / 2},${H0 - 24} L${X(LAT)},${Y(maxC)}" stroke="rgba(255,255,255,.05)"/>${stripes.join("")}
    <line x1="${W / 2}" x2="${W / 2}" y1="${Y(0)}" y2="${Y(maxC)}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 6"/>
    <g transform="translate(${W / 2},${Y(c.carry)})"><line x1="0" y1="0" x2="0" y2="-22" stroke="#fff" stroke-width="1.5"/><path d="M0,-22 L14,-17 L0,-12z" fill="#FF5A36"/><circle r="3" fill="#fff"/></g>
    ${ell}${dots}${ticks}<circle cx="${W / 2}" cy="${H0 - 24}" r="4" fill="#fff"/></svg>
  <div class="grid3" style="margin-top:12px;text-align:center"><div><b class="num">${Math.round(median(cv))}</b><div class="small muted">mediana (m)</div></div><div><b class="num">±${Math.round(sd(cv))}</b><div class="small muted">desv. carry</div></div><div><b class="num">${lat.length ? "±" + Math.round(sd(lat.map(x => x.lat))) : "—"}</b><div class="small muted">desv. lateral</div></div></div>
  ${carryOnly ? `<p class="small muted" style="margin:10px 0 0">${carryOnly} bolas sin lateral salen como marcas en el borde derecho. Activa «Lateral m» al registrar para verlas en el mapa.</p>` : ""}
  <div class="legend" style="margin-top:10px"><span><i style="background:#C8F53A"></i>Pura</span><span><i style="background:#F5A00B"></i>Talón o punta</span><span><i style="background:#EF4438"></i>Gruesa, fina o top</span></div></div>`;
}
function patternCard(shots) {
  const v = shots.filter(x => x.start && x.curve); if (v.length < 6) return "";
  const grid = {}; let best = null; for (const s of STARTS) for (const c of CURVES) { const n = v.filter(x => x.start === s && x.curve === c).length; grid[s + c] = n; if (!best || n > best.n) best = { s, c, n }; }
  const mx = Math.max(...Object.values(grid));
  const L = LV(); const startTxt = { Izq: "a la izquierda", Recta: "recta", Der: "a la derecha" };
  return `<div class="card"><div class="eyebrow">Tu patrón de vuelo</div>
  <p class="small" style="margin:6px 0 0">Lo más frecuente: sale <b>${startTxt[best.s]}</b> y ${best.c === "S" ? "<b>no curva</b>" : `curva <b>${curvePlain(best.c)}</b>`}${best.c !== "S" ? ` (${curveName(best.c).toLowerCase()})` : ""}. ${pct(best.n, v.length)} % de ${v.length} bolas.</p>
  <div class="heat"><span></span>${CURVES.map(c => `<span class="h">${curveIco(c).replace('width="24" height="24"', 'width="18" height="18"')}</span>`).join("")}
  ${STARTS.map(s => `<span class="h" style="text-align:left">${s === "Izq" ? "Izq." : s === "Der" ? "Dcha." : "Recta"}</span>${CURVES.map(c => { const n = grid[s + c]; const k = mx ? n / mx : 0; return `<span class="c" style="background:color-mix(in srgb,#C8F53A ${Math.round(k * 85)}%,var(--press));color:${k > .55 ? "#0D1A13" : "var(--mute)"}">${n || ""}</span>`; }).join("")}`).join("")}</div>
  <p class="tiny muted" style="margin:8px 0 0">Filas: hacia dónde sale. Columnas: cómo curva (${L >= 3 ? "de gancho a slice para un diestro" : "de mucha a la izquierda a mucha a la derecha"}).</p></div>`;
}
function contactCard(withC) {
  if (withC.length < 5) return "";
  const cols = { Pura: "#0FA874", "Talón": "#F5A00B", Punta: "#FFC861", Gruesa: "#EF4438", Fina: "#FF8D70", Top: "#A3321B" };
  const cnt = CONTACTS.map(k => [k, withC.filter(x => x.contact === k).length]).filter(([, n]) => n);
  const byClub = bagOn().map(c => { const v = withC.filter(x => x.club === c.id); return { c, n: v.length, p: v.length ? v.filter(x => x.contact === "Pura").length / v.length : 0 }; }).filter(r => r.n >= 3).sort((a, b) => a.p - b.p);
  return `<div class="card"><div class="eyebrow">Calidad de contacto</div><div class="bars">${cnt.map(([k, n]) => `<i style="width:${n / withC.length * 100}%;background:${cols[k]}" title="${k}: ${n}"></i>`).join("")}</div>

  ${byClub.length ? `<p class="small" style="margin:12px 0 0">Peor contacto: <b>${esc(byClub[0].c.name)}</b> (${Math.round(byClub[0].p * 100)} % puras en ${byClub[0].n} bolas)${byClub.length > 1 ? `. Mejor: <b>${esc(byClub[byClub.length - 1].c.name)}</b> (${Math.round(byClub[byClub.length - 1].p * 100)} %)` : ""}.</p>` : ""}</div>`;
}
function wedgeMatrix(shots) {
  const COLS = ["7:30", "9:00", "10:30", "Completo"];
  const ws = shots.filter(x => COLS.includes(x.call) && x.carry != null); if (ws.length < 3) return "";
  const cols = COLS.filter(k => ws.some(x => x.call === k)); const clubs = bagOn().filter(c => ws.some(x => x.club === c.id));
  return `<div class="card"><div class="eyebrow" style="margin-bottom:8px">Tus wedges (carry mediano)</div><table class="mx"><thead><tr><th>Palo</th>${cols.map(k => `<th>${k}</th>`).join("")}</tr></thead><tbody>
  ${clubs.map(c => `<tr><td>${esc(c.name)}</td>${cols.map(k => { const v = ws.filter(x => x.club === c.id && x.call === k).map(x => x.carry); return `<td class="num">${v.length ? Math.round(median(v)) : "—"}</td>`; }).join("")}</tr>`).join("")}</tbody></table>
  <p class="small muted" style="margin:8px 0 0">Haz una captura y llévala al campo.</p></div>`;
}
function scoreHistory(all) {
  const rows = DRILLS.filter(d => d.mode === "score").map(d => ({ d, v: all.flatMap(s => s.blocks.filter(b => b.drill === d.id && b.score != null).map(b => ({ v: b.score, date: s.date }))) })).filter(r => r.v.length);
  if (!rows.length) return "";
  return `<div class="card"><div class="eyebrow" style="margin-bottom:6px">Tests</div>${rows.map(r => `<div class="row between" style="padding:9px 0;border-bottom:1px solid var(--line)"><div><b>${esc(T(r.d.name, LV()))}</b><div class="small muted">${esc(r.d.label)}${r.d.lower ? " · cuanto menos, mejor" : ""}</div></div><div class="num" style="text-align:right">${r.v.slice(0, 4).map((x, i) => i ? `<span class="muted small">${x.v}</span>` : `<b style="font-size:20px">${x.v}</b>`).join(" ")}</div></div>`).join("")}</div>`;
}

// ---------- hojas y avisos ----------
function sheet(html) { $("#layer").innerHTML = `<div class="scrim" data-a="close-sheet"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`; }
function closeSheet() { $("#layer").innerHTML = ""; }
let toastT; function toast(t) { clearTimeout(toastT); let el = $(".toast"); if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); } el.textContent = t; toastT = setTimeout(() => el.remove(), 2600); }
function confirmSheet(title, text, yes, act) { sheet(`<h3 style="font-family:var(--display);font-size:22px;margin:0 0 6px">${esc(title)}</h3><p class="muted">${esc(text)}</p><div class="row" style="margin-top:14px"><button class="btn ghost" style="flex:1" data-a="close-sheet">Cancelar</button><button class="btn" style="flex:1;background:var(--bad);color:#fff" data-a="${act}">${esc(yes)}</button></div>`); }
function padSheet(key) { const dr = S.ui.draft; S.ui.padFor = key; S.ui.padVal = dr[key] == null ? "" : String(Math.abs(dr[key])); S.ui.padSign = key === "lat" ? (dr.lat < 0 ? -1 : 1) : 1; drawPad(); }
function drawPad() {

function burst() {

  const c = document.createElement("canvas"); c.className = "confetti"; const dpr = devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr; document.body.appendChild(c);
  const x = c.getContext("2d"); const cols = ["#FF6A3D", "#3D7BFF", "#10B381", "#FFB020", "#8B5CF6", "#C8F53A"];
  const ps = Array.from({ length: 110 }, () => ({ x: c.width / 2, y: c.height * .35, vx: (Math.random() - .5) * 18 * dpr, vy: (-Math.random() * 16 - 4) * dpr, s: (4 + Math.random() * 5) * dpr, c: pick(cols), r: Math.random() * 6 }));

// ---------- acciones ----------
function startSession() {
  const pr = P(); let plan = pr.plan; if (!plan || plan.lv !== LV()) plan = generatePlan();
  const s = { id: "s" + nid(), date: Date.now(), status: "live", lv: plan.lv, hcp: hcpUsed(), minutes: plan.minutes, stage: plan.stage, wild: plan.wild, focus: plan.focus, blocks: JSON.parse(JSON.stringify(plan.blocks)), shots: [], cur: 0, xpGain: 0, updated: Date.now() };
  S.sessions.push(s); pr.plan = null; saveProfile(); saveSession(s, 100);

}
function addXP(n) { const ls = liveSession(); if (ls) ls.xpGain = (ls.xpGain || 0) + n; const before = rank(P().xp || 0).i; P().xp = (P().xp || 0) + n; const after = rank(P().xp).i; if (after > before) { toast(`¡Rango ${after}: ${rank(P().xp).name}!`); burst(); } }
const curStep = () => { const s = liveSession(); if (!s) return null; const b = s.blocks[s.cur]; return b && b.steps ? b.steps[b.cursor] : null; };
function setHcp(v) { const before = LV(); P().hcp = Math.round(clamp(v, -5, 54) * 10) / 10; saveProfile(); const after = LV(); if (after !== before) toast(`Nivel ${GAME[after].name}: ejercicios y ventanas adaptados`); }
const ACT = Object.assign({}, RD_ACT_REF(), {
  "gen": () => { P().plan = generatePlan(); saveProfile(); render(); setTimeout(() => { const el = $(".wild"); el && el.scrollIntoView({ behavior: "smooth", block: "start" }); }, 50); },
  "gen-go": () => { P().plan = generatePlan(); saveProfile(); location.hash = "#plan"; },
  "set": a => { const k = a.dataset.k; let v = a.dataset.v; if (["minutes", "discomfort"].includes(k)) v = +v; P()[k] = v; saveProfile(); render(); },
  "theme": a => { P().theme = a.dataset.v; saveProfile(); applyTheme(); render(); },
  "hcp": a => { setHcp((parseFloat(P().hcp) || 0) + +a.dataset.v); render(); },
  "toggle": a => { const k = a.dataset.k; P()[k] = !P()[k]; saveProfile(); render(); },
  "wild": () => { const pl = P().plan; let w; do { w = pick(WILD); } while (w === pl.wild && WILD.length > 1); pl.wild = w; saveProfile(); render(); },
  "swap": a => { const pl = P().plan; const i = +a.dataset.i; const b = pl.blocks[i]; const L = LV(); const used = new Set(pl.blocks.map(x => x.drill)); const c = DRILLS.filter(d => d.phases.includes(b.phase) && inLv(d, L) && !used.has(d.id) && (P().shortGame || !["short", "putt"].includes(d.area)) && d.stage == null); if (!c.length) { toast("No hay más ejercicios de tu nivel para esta fase"); return; } pl.blocks[i] = makeBlock(pick(c), b.phase, b.min, L); saveProfile(); render(); },
  "start": startSession,
  "lib": a => { S.ui.libArea = a.dataset.v; render(); },
  "drill-info": a => drillSheet(D(a.dataset.id)),
  "close-sheet": () => closeSheet(),
  "timer": () => { if (TIMER.run) { TIMER.acc += Date.now() - TIMER.start; TIMER.run = false; } else { TIMER.start = Date.now(); TIMER.run = true; } tickTimer(); },
  "d-club": a => { S.ui.draft.club = a.dataset.v; render(); },
  "d-step": a => { const dr = S.ui.draft; const k = a.dataset.k; const st = curStep(); const ref = (st && st.target) || (club(dr.club) || {}).carry || 100; const base = dr[k] == null ? (k === "total" ? (dr.carry || ref) + 5 : k === "speed" ? 150 : k === "lat" ? 0 : ref) : dr[k]; dr[k] = k === "lat" ? clamp(base + +a.dataset.v, -80, 80) : Math.max(0, base + +a.dataset.v); if (k === "lat") dr.zone = zoneOf(dr.lat); vib(8); render(); },
  "d-set": a => { const dr = S.ui.draft; const k = a.dataset.k, v = a.dataset.v; dr[k] = dr[k] === v ? null : v; vib(8); render(); },
  "d-zone": a => { const dr = S.ui.draft; dr.zone = dr.zone === a.dataset.v ? null : a.dataset.v; vib(8); render(); },
  "field": a => { const f = P().fields; f[a.dataset.k] = !f[a.dataset.k]; saveProfile(); render(); },
  "pad": a => padSheet(a.dataset.k),
  "pad-k": a => { const v = a.dataset.v; if (v === "del") S.ui.padVal = S.ui.padVal.slice(0, -1); else if (S.ui.padVal.length < 3) S.ui.padVal = (S.ui.padVal === "0" ? "" : S.ui.padVal) + v; drawPad(); },
  "pad-sign": a => { S.ui.padSign = +a.dataset.v; drawPad(); },
  "pad-ok": () => { const dr = S.ui.draft; const k = S.ui.padFor; dr[k] = S.ui.padVal === "" ? null : (+S.ui.padVal) * (k === "lat" ? S.ui.padSign : 1); if (k === "lat") dr.zone = zoneOf(dr.lat); closeSheet(); render(); },
  "save-shot": () => saveShot(false),
  "skip": () => saveShot(true),
  "undo": () => undoShot(),
  "cnt": a => { const s = liveSession(); const b = s.blocks[s.cur]; const v = +a.dataset.v; b.log.push(v); b.cnt++; if (v) { b.ok++; b.streak++; b.best = Math.max(b.best, b.streak); addXP(4); vib(15); } else { b.streak = 0; addXP(1); vib([10, 40, 10]); } if (b.cnt === b.n) { toast(`Bloque hecho: ${b.ok} de ${b.n}`); if (b.ok / b.n >= .7) burst(); } saveSession(s); render(); },
  "cnt-undo": () => { const s = liveSession(); const b = s.blocks[s.cur]; if (!b.cnt) return; const v = b.log.pop(); b.cnt--; if (v) b.ok--; let st = 0; for (let i = b.log.length - 1; i >= 0 && b.log[i]; i--) st++; b.streak = st; saveSession(s); render(); },
  "next-block": () => { const s = liveSession(); const b = s.blocks[s.cur]; if (!b.done) { b.done = true; addXP(15); } s.cur++; S.ui.draft = null; S.ui.lastResult = null; saveSession(s); saveProfile(); render(); scrollTo(0, 0); },
  "prev-block": () => { const s = liveSession(); if (s.cur > 0) { s.cur--; S.ui.draft = null; S.ui.lastResult = null; saveSession(s); render(); scrollTo(0, 0); } },
  "abandon": () => confirmSheet("¿Abandonar la sesión?", "Las bolas ya registradas se guardan como sesión terminada. Si no hay ninguna, se borra.", "Abandonar", "abandon-yes"),
  "abandon-yes": () => { const s = liveSession(); closeSheet(); if (!s) return; if (!(s.shots || []).length && !s.blocks.some(b => b.cnt || b.score != null)) deleteSession(s.id); else { s.status = "done"; saveSession(s, 100); } location.hash = "#hoy"; render(); },
  "rate": a => { const s = liveSession(); s.rating = +a.dataset.v; saveSession(s); render(); },
  "finish": () => { const s = liveSession(); addXP(50); s.status = "done"; saveSession(s, 100); saveProfile(); burst(); toast("Sesión guardada. ¡Buen trabajo!"); location.hash = "#hoy"; render(); scrollTo(0, 0); },
  "sess-open": a => { const s = S.sessions.find(x => x.id === a.dataset.id); s && sessionSheet(s); },
  "sess-del": a => { S.ui.delId = a.dataset.id; confirmSheet("¿Borrar esta sesión?", "Se eliminan sus bolas y resultados. No se puede deshacer.", "Borrar", "sess-del-yes"); },
  "sess-del-yes": async () => { closeSheet(); await deleteSession(S.ui.delId); toast("Sesión borrada"); render(); },
  "drange": a => { S.ui.dataRange = a.dataset.v; render(); },
  "dclub": a => { S.ui.dataClub = a.dataset.v; render(); },
  "copy-csv": async () => {

    const csv = rows.map(r => r.map(v => /[",;\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(",")).join("\n");
    try { await navigator.clipboard.writeText(csv); toast(`Copiadas ${rows.length - 1} bolas`); }
    catch (e) { sheet(`<div class="eyebrow">Copia manual</div><textarea style="min-height:240px;font-family:var(--mono);font-size:11px" readonly>${esc(csv)}</textarea><button class="btn block" style="margin-top:10px" data-a="close-sheet">Cerrar</button>`); const ta = $("#layer textarea"); ta && ta.select(); }
  },
  "club-on": a => { const c = P().bag[+a.dataset.i]; c.on = !c.on; saveProfile(); render(); },
  "club-c": a => { const c = P().bag[+a.dataset.i]; c.carry = clamp(c.carry + +a.dataset.v, 10, 300); c.est = false; saveProfile(); render(); },
  "club-sug": a => { const c = P().bag[+a.dataset.i]; c.carry = +a.dataset.v; c.est = false; saveProfile(); toast(`${c.name}: ${c.carry} m`); render(); },
  "reset": () => confirmSheet("¿Borrar todo?", "Perfil, bolsa y todas las sesiones. No se puede deshacer.", "Borrar todo", "reset-yes"),
  "reset-yes": async () => { closeSheet(); const ids = S.sessions.map(s => s.id); const rids = S.rounds.map(r => r.id); S.sessions = []; S.rounds = []; invalidate(); for (const id of rids) if (DB) { try { await DB.doc(roundPath(id)).delete(); } catch (e) {} } S.profile = DEFAULT_PROFILE(); saveProfile(); saveLocal(); for (const id of ids) if (DB) { try { await DB.doc(sessPath(id)).delete(); } catch (e) {} } applyTheme(); toast("Todo borrado"); render(); }
});
function RD_ACT_REF() { return Object.assign({}, RD_ACT, BK_ACT); }
function saveShot(skip) {
  const s = liveSession(); const b = s.blocks[s.cur]; const step = b.steps[b.cursor]; if (!step) return;
  if (skip) { b.cursor++; S.ui.draft = null; S.ui.lastResult = { b: s.cur, ok: null, text: "Bola saltada.", skip: true }; saveSession(s); render(); return; }
  const dr = S.ui.draft; const need = NEEDS[step.kind];
  if (need && dr[need] == null && !(need === "zone" && dr.lat != null)) { toast(`Falta ${NEED_TXT[need]}: es lo que puntúa en este ejercicio`); return; }
  if (s.shots.length >= 600) { toast("Máximo de bolas por sesión"); return; }
  const sh = { id: nid(), ts: Date.now(), b: s.cur, i: b.cursor, club: dr.club, carry: dr.carry, total: dr.total, lat: dr.lat, zone: dr.zone || zoneOf(dr.lat), start: dr.start, curve: dr.curve, contact: dr.contact, traj: dr.traj, speed: dr.speed, call: step.call || null, target: step.target || null, kind: step.kind, tol: step.kind === "carry" ? tolFor(step.target) : null };
  for (const k of Object.keys(sh)) if (sh[k] == null) delete sh[k];
  const ok = judge(step, sh); if (ok != null) sh.ok = ok;
  s.shots.push(sh); b.cursor++;
  let text;
  if (ok != null) {
    b.judged++;
    if (ok) { b.okN++; b.streak++; b.best = Math.max(b.best, b.streak); b.pts += 2 ** (b.streak - 1); addXP(5); vib(20); } else { b.streak = 0; addXP(2); vib([12, 50, 12]); }
    if (step.kind === "carry") { const df = sh.carry - step.target; text = ok ? `Dentro: ${df === 0 ? "clavada" : (df > 0 ? "+" : "") + df + " m"}` : `Fuera por ${Math.abs(df) - sh.tol} m (${df > 0 ? "larga" : "corta"}, ${df > 0 ? "+" : ""}${df} m)`; }
    else if (step.kind === "fw") text = ok ? (sh.zone === "C" ? "En calle" : "En juego (rough)") : `${sh.zone && sh.zone.startsWith("OB") ? "Fuera de juego" : "Fuera de calle"}: ${ZONE_TXT[sh.zone] || ""}`;
    else if (step.kind === "start") text = ok ? "Sale a la línea" : `Sale hacia la ${sh.start === "Izq" ? "izquierda" : "derecha"}`;
    else if (step.kind === "curve") text = ok ? (sh.curve === "S" ? "Recta" : `Curva controlada (${curvePlain(sh.curve)})`) : `Curva ${curvePlain(sh.curve)}`;
    else if (step.kind === "shape") text = ok ? `Conseguido: ${step.call.toLowerCase()}` : `Pedido ${step.call.toLowerCase()}, salió ${sh.curve === "S" ? "recta" : curveName(sh.curve).toLowerCase()}`;
    else if (step.kind === "traj") text = ok ? `Altura ${step.call.toLowerCase()}: conseguido` : `Pedida ${step.call.toLowerCase()}, salió ${sh.traj.toLowerCase()}`;
    else text = ok ? `Contacto bueno (${sh.contact.toLowerCase()})` : `Contacto: ${sh.contact.toLowerCase()}`;
    if (ok && b.streak >= 3) text += ` · racha ${b.streak}`;
    if (b.drill === "streak" && ok && b.streak === { 1: 3, 2: 5, 3: 7, 4: 9 }[b.lv || LV()]) { text = "¡Reto conseguido!"; burst(); }
  } else { addXP(2); text = `Guardada${sh.carry != null ? `: ${sh.carry} m` : ""} · ${clubName(sh.club)}`; }
  S.ui.lastResult = { b: s.cur, ok: ok ?? null, text }; S.ui.draft = null;
  if (!b.steps[b.cursor]) { if (!b.done) { b.done = true; addXP(15); } toast("Bloque completado"); if (b.judged && b.okN / b.judged >= .6) burst(); }
  saveSession(s); saveProfile(); render();
}
function undoShot() {
  const s = liveSession(); const b = s.blocks[s.cur]; const res = S.ui.lastResult;
  if (res && res.skip) { b.cursor = Math.max(0, b.cursor - 1); S.ui.lastResult = null; S.ui.draft = null; saveSession(s); render(); return; }
  const idx = s.shots.map(x => x.b).lastIndexOf(s.cur); if (idx < 0) return;
  const sh = s.shots.splice(idx, 1)[0]; b.cursor = Math.max(0, b.cursor - 1); b.done = false;
  if (sh.ok != null) { b.judged--; if (sh.ok) b.okN--; }
  b.streak = 0; b.best = 0; b.pts = 0; for (const x of s.shots.filter(x => x.b === s.cur && x.ok != null)) { if (x.ok) { b.streak++; b.best = Math.max(b.best, b.streak); b.pts += 2 ** (b.streak - 1); } else b.streak = 0; }
  S.ui.lastResult = null; S.ui.draft = null; saveSession(s); toast("Bola deshecha"); render();
}

// ---------- eventos ----------
document.addEventListener("click", e => { const a = e.target.closest("[data-a]"); if (!a) return; if (a.classList.contains("scrim") && e.target !== a) return; const f = ACT[a.dataset.a]; if (f) { e.preventDefault(); f(a, e); } });
document.addEventListener("input", e => {
  const rf = e.target.closest("[data-rf]"); if (rf) { rdInput(rf); return; }
  const el = e.target.closest("[data-f]"); if (!el) return; const k = el.dataset.f;
  if (k === "score") { const s = liveSession(); const b = s && s.blocks[s.cur]; if (!b) return; b.score = el.value === "" ? null : +el.value; saveSession(s, 1200); }
  else if (k === "note") { const s = liveSession(); if (s) { s.note = el.value.slice(0, 600); saveSession(s, 1500); } }
  else if (k === "name") { P().name = el.value.slice(0, 30); P().updated = Date.now(); saveLocal(); Saver.queue(profPath(), () => S.profile, 1500); }
  else if (k === "goal") { const v = parseFloat(el.value); if (!isNaN(v)) { P().goal = clamp(v, -5, 54); P().updated = Date.now(); saveLocal(); Saver.queue(profPath(), () => S.profile, 1500); } }
});
document.addEventListener("change", e => { const el = e.target.closest('[data-f="hcp"]'); if (!el) return; const v = parseFloat(String(el.value).replace(",", ".")); if (!isNaN(v)) setHcp(v); render(); });
addEventListener("hashchange", () => { closeSheet(); const go = () => { render(); scrollTo(0, 0); }; if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(go); else go(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

// ---------- arranque ----------
(function boot() {
  const loc = loadLocal();
  if (loc) { HAD_LOCAL = true; S.profile = normProfile(loc.profile); S.sessions = (Array.isArray(loc.sessions) ? loc.sessions : []).map(migrateSession); S.rounds = Array.isArray(loc.rounds) ? loc.rounds : []; }
  loadRdDraft();
  if (IN_PWA && navigator.storage && navigator.storage.persist) { navigator.storage.persist().then(v => { STORAGE_OK = v; }).catch(() => {}); }
  applyTheme(); setSync("local"); render(); initCloud();
})();
